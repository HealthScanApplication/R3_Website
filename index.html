      .ed-cta, .ed-cta-dark {

        text-transform: uppercase;
        letter-spacing: 0.12em;
        line-height: 1;

        border-radius: 2px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color .2s ease, color .2s ease, border-color .2s ease;
      }
      /* font-size !important: beats the global `button { font-size:16px !important }` iOS anti-zoom rule */
      .ed-cta, .ed-cta-dark { font-size: 12px !important; }
      .ed-cta { color: #16140F; border-color: #16140F; }
      .ed-cta:hover { background: #16140F; color: #F4F1EA; }
      .ed-cta-dark { color: #F4F1EA; border-color: rgba(244,241,234,0.5); }
      .ed-cta-dark:hover { background: #F4F1EA; color: #16140F; border-color: #F4F1EA; }
      .ed-cta:disabled, .ed-cta-dark:disabled { opacity: .5; cursor: default; }
      /* hide the scrollbar inside the phone-framed protocol timeline */
      .phone-scroll { scrollbar-width: none; -ms-overflow-style: none; }
      .phone-scroll::-webkit-scrollbar { display: none; }
      /* editorial submit button (shadcn <button>) — un-force the size + keep text centered */
      .ed-cta-sub { font-size: 11px !important; line-height: 1 !important; }
      /* editorial email input — match the button's 11px size and a black placeholder (photo hero backdrop).
         Doubled class (0,2,0) out-specifies the global input[type=email] anti-zoom rule (0,1,1). */
      .editorial-email-input.editorial-email-input { font-size: 11px !important; }
      .editorial-email-input.editorial-email-input::placeholder { color: #16140F !important; opacity: 1 !important; }
      /* desktop nav links — small, uppercase, letter-spaced (out-specifies the global button anti-zoom rule) */
      nav[aria-label="Main navigation"] button { font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.12em; text-transform: uppercase; }
      /* header: collapse the inline nav + right actions into the 3-dots menu before they
         overflow the rounded pill. Custom breakpoint because Tailwind's xl: isn't compiled. */
      .hs-hdr-wide { display: flex; }
      .hs-hdr-narrow { display: none; }
      @media (max-width: 1199px) {
        .hs-hdr-wide { display: none !important; }
        .hs-hdr-narrow { display: block !important; }
      }
    </style>
