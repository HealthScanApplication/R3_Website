[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # Netlify variables for this legacy site include public URLs, project refs,
  # hostnames and sender addresses marked as secrets. They are intentionally
  # present in client code and make the scanner reject every deploy preview.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

# Brand migration — healthscan.live -> routine3.com (canonical domain)
[[redirects]]
  from = "https://healthscan.live/*"
  to = "https://routine3.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.healthscan.live/*"
  to = "https://routine3.com/:splat"
  status = 301
  force = true

# Static files served directly (before SPA catch-all)
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/og-image.png"
  to = "/og-image.png"
  status = 200

# Universal links (DEV-1640). Must sit above the forced SPA catch-all, or the
# association file is served as index.html and iOS silently ignores routine3.com.
[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200
  force = true

[[redirects]]
  from = "/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200
  force = true

# Share previews: link crawlers do not run the app, so each shareable route is served a page with its own tags (title,
# description, card image). scripts/gen-share-pages.mjs writes /share/<route>.html after the build; the same list of routes
# is in src/config/shareRoutes.json and scripts/check-routes.mjs fails the build if the two drift. These sit above the
# catch-all, and the blog (?page=blog) rule above the home rule.
[[redirects]]
  from = "/share/*"
  to = "/share/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/guardians"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/guardians/*"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/guides"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/guides/*"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/guide"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/g/*"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/@*"
  to = "/share/guardians.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  query = {page = "blog"}
  to = "/share/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/join/*"
  to = "/join/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/protocol/*"
  to = "/protocol/index.html"
  status = 200
  force = true

# A Guardian's shared routine (routine share links): the token is the permission. The page shows the routine's name
# and offers the app; with R³ installed iOS hands the link to the app (the association file claims /routine/*).
[[redirects]]
  from = "/routine/*"
  to = "/routine/index.html"
  status = 200
  force = true

# Legal pages. They live on Notion (same URLs the app and App Store Connect use,
# mobile repo src/config/links.ts). 302 on purpose: the destination will move to
# an owned page later and a 301 would be cached by browsers and crawlers.
# Must sit above the forced catch-all, or these paths return the home shell.
[[redirects]]
  from = "/privacy"
  to = "https://privacy-healthscan.notion.site/Privacy-Policy-AI-Health-Scan-265d6c957aa080f5aeccdaacf419968b"
  status = 302
  force = true

[[redirects]]
  from = "/terms"
  to = "https://terms-healthscan.notion.site/Terms-of-Use-AI-Health-Scan-265d6c957aa080bc92f0e5b77d63b5d2"
  status = 302
  force = true

# Newsletter unsubscribe: the link in every marketing email is
# /unsubscribe?t=<token>. Static page; it calls the existing unsubscribe_email
# RPC on production. A rewrite rather than the SPA, which would treat a single
# word path as a referral code.
[[redirects]]
  from = "/unsubscribe"
  to = "/unsubscribe/index.html"
  status = 200
  force = true

# Social preview image (a real JPEG; og-image.png is the same bytes under an
# older name that the old meta tags still point at).
[[redirects]]
  from = "/og.jpg"
  to = "/og.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache robots/sitemap with short TTL
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

# iOS requires application/json for the association file (no extension, so
# Netlify would otherwise guess application/octet-stream).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/join/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The routine share token is in this page's URL: keep it out of referrers, caches and search indexes, and let the page
# talk to nothing but the two Supabase projects that can mint a token. script-src carries the hash of the single inline
# script; scripts/check-routes.mjs fails the build if the two ever drift (a stale hash blocks the script silently).
[[headers]]
  for = "/routine/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-gFH7CUdUOz44/29l0AMB8uGOSlKv8ggictxjv1baqX0='; style-src 'unsafe-inline'; connect-src https://mofhvoudjxinvpplsytd.supabase.co https://ermbkttsyvpenjjxaxcf.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# The unsubscribe token is in this page's URL: keep it out of referrers, caches
# and search indexes, and let the page talk to nothing but the one API host.
# script-src carries the hash of the single inline script; scripts/check-routes.mjs
# fails the build if the two ever drift (a stale hash blocks the script silently).
[[headers]]
  for = "/unsubscribe"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-MtHRxFEPPJoBnPs/gIVcxku3sclRd7qLt4FBcoA8pDs='; style-src 'unsafe-inline'; connect-src https://ermbkttsyvpenjjxaxcf.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/share/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=86400"
