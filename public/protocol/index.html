<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A routine for you · Routine³</title>
<meta name="description" content="Someone shared a Routine³ routine with you. Open it in the R³ app.">
<!-- Link previews (iMessage, WhatsApp, Slack, X): the R³ card for this route. No og:url: the token in this page's URL must not be repeated anywhere. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ROUTINE³">
<meta property="og:title" content="A routine for you · Routine³">
<meta property="og:description" content="Someone shared a Routine³ routine with you. Open it in the R³ app.">
<meta property="og:image" content="https://routine3.com/share/routine.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="R³ Routine on ROUTINE³">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="A routine for you · Routine³">
<meta name="twitter:description" content="Someone shared a Routine³ routine with you. Open it in the R³ app.">
<meta name="twitter:image" content="https://routine3.com/share/routine.jpg">
<!-- Smart App Banner: "Get" without R³, "Open" with it (Safari on iOS only). -->
<meta name="apple-itunes-app" content="app-id=6740406583">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4; --surface: #FFFFFF; --ink: #1A1A1A; --muted: #5C5C5C; --faint: #8A8A8A;
    --line: #E8E5DD; --button: #1A1A1A; --button-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --surface: #1C1C1C; --ink: #F4F2EE; --muted: #B5B2AC; --faint: #85827D;
      --line: #2E2E2E; --button: #F4F2EE; --button-ink: #111111;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, -apple-system, sans-serif; line-height: 1.5; }
  main { max-width: 480px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) 16px 48px; }
  .mark { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px;
          background: var(--button); color: var(--button-ink); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .mark sup { font-size: 10px; margin-left: 1px; }
  .eyebrow { margin-top: 32px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
  h1 { margin-top: 6px; font-size: clamp(28px, 8vw, 36px); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .creator { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .cover { margin-top: 24px; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 18px; background: var(--line); }
  .about { margin-top: 20px; font-size: 16px; color: var(--muted); }
  .actions { margin-top: 32px; display: grid; gap: 12px; }
  .button { display: block; text-align: center; padding: 16px 20px; min-height: 52px; border-radius: 14px; font-weight: 600; font-size: 16px; text-decoration: none; }
  .primary { background: var(--button); color: var(--button-ink); }
  .secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .note { margin-top: 16px; font-size: 13px; color: var(--faint); }
  .fine { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .fine a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <span class="mark" aria-label="Routine³">R<sup>3</sup></span>

  <p class="eyebrow" id="eyebrow">A routine for you</p>
  <h1 id="title">Open this routine in R³</h1>
  <p class="creator" id="creator" hidden></p>
  <p class="about" id="about" hidden></p>

  <div class="actions">
    <a class="button primary" id="store" href="https://apps.apple.com/app/id6740406583">Get R³ on the App Store</a>
    <a class="button secondary" id="open" href="healthscan://" hidden>I have R³: open this routine</a>
  </div>
  <p class="note" id="note">R³ is on iPhone. Install it, then scan the code again to add this routine.</p>

  <p class="fine">
    <span id="attribution" hidden></span>
    Routine³ ·
    <a href="https://privacy-healthscan.notion.site/Privacy-Policy-AI-Health-Scan-265d6c957aa080f5aeccdaacf419968b">Privacy</a> ·
    <a href="https://terms-healthscan.notion.site/Terms-of-Use-AI-Health-Scan-265d6c957aa080bc92f0e5b77d63b5d2">Terms</a>
  </p>
</main>

<script>
/*
 * Fallback for https://healthscan.app/protocol/<uuid> when R³ is not installed.
 * Spec and hosting steps: web/healthscan.app/README.md in the mobile repo.
 *
 * Reads ONE catalog routine by id and shows its name. Everything it prints comes
 * from the database through textContent, never from the URL, so nobody can put
 * their own words on this domain by editing a link.
 */
(function () {
  // Filled at deploy time. Anon keys are public by design (the app ships them);
  // a source whose key is still a placeholder is skipped, and the page stays generic.
  var SOURCES = [
    { url: 'https://ermbkttsyvpenjjxaxcf.supabase.co', key: '__R3_PROD_ANON_KEY__' },     // prod: the user client
    { url: 'https://mofhvoudjxinvpplsytd.supabase.co', key: '__R3_STAGING_ANON_KEY__' }, // staging: the catalog client
  ];
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  var match = location.pathname.match(/^\/protocol\/([^/]+)\/?$/);
  var id = match ? decodeURIComponent(match[1]) : '';
  var $ = function (elId) { return document.getElementById(elId); };

  if (!UUID_RE.test(id)) {
    $('eyebrow').textContent = 'Routine³';
    $('title').textContent = 'This link does not point at a routine';
    $('note').textContent = 'Ask whoever shared it for a fresh code, or get R³ and browse the routines there.';
    return;
  }

  // Same link through the app scheme: for an in-app browser, or Safari after the
  // banner's "Open", where iOS does not hand an https link to the app itself.
  var open = $('open');
  open.href = 'healthscan://protocol/' + id;
  open.hidden = false;

  function show(row) {
    if (!row || !row.name) return;
    document.title = row.name + ' · Routine³';
    $('title').textContent = row.name;
    if (row.creator) { $('creator').textContent = 'Drawn from the work of ' + row.creator; $('creator').hidden = false; }
    if (row.description) { $('about').textContent = row.description; $('about').hidden = false; }
    if (row.image_url && /^https:\/\//.test(row.image_url)) {
      var cover = document.createElement('img');
      cover.className = 'cover';
      cover.alt = '';
      cover.onerror = function () { cover.remove(); };
      cover.src = row.image_url;
      $('creator').insertAdjacentElement('afterend', cover);
    }
    if (row.source_attribution) { $('attribution').textContent = row.source_attribution + ' '; $('attribution').hidden = false; }
  }

  // Shared catalog routines only (user_id null). A personal routine's name never
  // reaches this page, whatever RLS would return for its id.
  function read(i) {
    var source = SOURCES[i];
    if (!source) return;
    if (source.key.indexOf('__') === 0) return read(i + 1);
    var query = '/rest/v1/protocols?select=name,description,creator,source_attribution,image_url'
      + '&id=eq.' + encodeURIComponent(id) + '&user_id=is.null&is_personal_routine=not.is.true&limit=1';
    fetch(source.url + query, { headers: { apikey: source.key, Authorization: 'Bearer ' + source.key } })
      .then(function (res) { return res.ok ? res.json() : []; })
      .then(function (rows) { if (rows && rows[0]) show(rows[0]); else read(i + 1); })
      .catch(function () { read(i + 1); });
  }
  read(0);
})();
</script>
</body>
</html>
